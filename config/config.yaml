# Configuration settings for Snakemake

# Relative path where your samples are found
samples: config/samples.tsv

# Path to your raw sequencing reads
input_reads: /nfs/turbo/umms-esnitkin/Github/test_data/fastq

# Directory prefix where the outputs will be saved to
# Rename this to your preferred naming convention
prefix: 2024-05-22_snpkit-smk

# Change to genome size of your organism of interest
genome_size: 5000000

#ncores: 4

#threads: 12

# Reference Genome Settings
# Change path to reference genome based on your organism of interest
reference_genome: /nfs/esnitkin/bin_group/variant_calling_bin/reference/KPNIH1/KPNIH1.fasta
# Change path
bed_file: /nfs/esnitkin/bin_group/variant_calling_bin/reference/KPNIH1/KPNIH1.bed

# Command line parameters for rule trimmomatic_pe
adaptor_filepath: config/adapters/combined_Adaptors.fa
seed_mismatches: 2
palindrome_clipthreshold: 30
simple_clipthreshold: 10
minadapterlength: 8
keep_both_reads: true
#sliding window
window_size: 4
window_size_quality: 20
#minlength
minlength: 40
#headcrop
headcrop_length: 0

#bwa
ncores: 8

#samtools
#mpileup_parameters: -ug -f

#gatk
#haplotype_parameters: HaplotypeCaller
# indel -- gatk filters
dp_indel_filter: DP > 9
mq_indel_filter: MQ > 50.00
qual_indel_filter: QUAL > 2
af_indel_filter: AF > 0.900

#snp filters-- samtools/bcftools
dp_snp_filter: DP > 9
fq_snp_filter: FQ < 0.025
mq_snp_filter: MQ > 50
qual_snp_filter: QUAL > 100
af_snp_filter: AF1 > 0.900

#snpEff
snpEff_path: ./.snakemake/conda/c6e700b7c2bff3b3473fa26921e754ab_/share/snpeff-5.0-1/snpEff.jar
data_dir: /gpfs/accounts/esnitkin_root/esnitkin1/dhatrib/snpkit-smk/data
snpEff_config_file: ./.snakemake/conda/c6e700b7c2bff3b3473fa26921e754ab_/share/snpeff-5.0-1/snpEff.config
snpeff_parameters: -d -no-downstream -no-upstream
